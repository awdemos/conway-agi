[package]
name = "conway_agi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
rand = "0.10.2"
ratatui = "0.30.2"
reqwest = { version = "0.12.15", features = ["blocking", "json"], optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }

[features]
default = []
llm = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[[bin]]
name = "conway-agi"
path = "src/main.rs"

[dev-dependencies]
rand_chacha = "0.10.0"
